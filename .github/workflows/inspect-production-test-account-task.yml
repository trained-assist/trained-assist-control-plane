name: Inspect one existing production test-account task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read one task ID or find test-account tasks in a fixed time window
        required: true
        type: choice
        options:
          - inspect-task
          - find-canary-task
      task_id:
        description: Exact existing userTaskId; required only for inspect-task
        required: false
        type: string
      from_ms:
        description: Start of the bounded test-account task lookup window (Unix ms)
        required: false
        type: string
      to_ms:
        description: End of the bounded test-account task lookup window (Unix ms)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-task-report-read
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read and sanitize one existing task's lifecycle
        if: inputs.mode == 'inspect-task'
        env:
          TASK_ID: ${{ inputs.task_id }}
          PRINCIPAL_SECRET: ${{ secrets.PRINCIPAL_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';

          const taskId = process.env.TASK_ID?.trim() ?? '';
          const secret = process.env.PRINCIPAL_SECRET?.trim() ?? '';
          const principal = 'gateway';
          const base = 'https://trained-assist-cp-production.skillset-apply.workers.dev';
          const safeLabel = (value) => typeof value === 'string' && /^[A-Za-z0-9_.:-]{1,160}$/.test(value) ? value : null;
          if (!/^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(taskId)) throw new Error('invalid_task_id');
          if (secret.length < 32) throw new Error('production_e2e_principal_secret_missing');
          const headers = {
            'x-principal': principal,
            'x-principal-sig': createHmac('sha256', secret).update(principal).digest('hex'),
          };
          const get = async (path) => {
            const response = await fetch(new URL(path, base), { headers, signal: AbortSignal.timeout(10_000) });
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`task_report_http_${response.status}`);
            return body;
          };
          const post = async (path, body) => {
            const response = await fetch(new URL(path, base), {
              method: 'POST', headers: { ...headers, 'content-type': 'application/json' },
              body: JSON.stringify(body), signal: AbortSignal.timeout(10_000),
            });
            const value = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`task_report_http_${response.status}`);
            return value;
          };

          const receipt = await get(`/receipt?taskId=${encodeURIComponent(taskId)}`);
          const events = [];
          let after;
          for (let pageIndex = 0; pageIndex < 5; pageIndex += 1) {
            const query = new URLSearchParams({ taskId, limit: '100' });
            if (after !== undefined) query.set('after', String(after));
            const page = await get(`/report/history?${query}`);
            for (const event of page.events ?? []) {
              const payload = event.payload ?? {};
              events.push({
                kind: event.kind,
                sequence: event.sequence,
                occurredAt: event.occurredAt,
                event: safeLabel(payload.event),
                runId: safeLabel(payload.runId),
                attemptId: safeLabel(payload.attemptId),
                status: safeLabel(payload.status),
                reason: safeLabel(payload.reason),
                code: safeLabel(payload.code),
                step: safeLabel(payload.step),
              });
            }
            const next = page.cursor;
            if (!page.hasMore) break;
            if (!Number.isSafeInteger(next) || next <= (after ?? 0)) throw new Error('task_history_cursor_did_not_advance');
            after = next;
            if (pageIndex === 4) throw new Error('task_history_page_limit_exceeded');
          }

          const snapshot = await get(`/report?taskId=${encodeURIComponent(taskId)}`);
          const runtime = await post('/status', { taskId });
          const engine = runtime.engine && typeof runtime.engine === 'object' ? runtime.engine : {};
          const runStatuses = Array.isArray(runtime.runs) ? runtime.runs.map((run) => ({
            status: safeLabel(run.status), generation: Number.isSafeInteger(run.generation) ? run.generation : null,
            engine: safeLabel(run.engine),
          })) : [];
          console.log(JSON.stringify({
            taskId,
            receipt: {
              durable: receipt.durable === true,
              status: receipt.status ?? null,
              createdAt: receipt.createdAt ?? null,
              requestId: receipt.requestId ?? null,
            },
            task: {
              status: snapshot.snapshot?.status ?? null,
              stage: snapshot.snapshot?.stage ?? null,
              generation: snapshot.snapshot?.generation ?? null,
              deliveryState: snapshot.snapshot?.deliveryState ?? null,
              updatedAt: snapshot.snapshot?.updatedAt ?? null,
            },
            latestEventSequence: snapshot.latestEventSequence ?? null,
            eventCount: snapshot.eventCount ?? null,
            events,
            runtime: {
              workflowStatus: safeLabel(engine.status),
              workflowError: engine.error ? true : false,
              runCount: runStatuses.length,
              runs: runStatuses,
            },
            sideEffects: 'read_only; no task, LLM, or Runner request was created',
          }));
          NODE
      - name: Find exact test-account CP rows from the prior canary window (read only)
        if: inputs.mode == 'find-canary-task'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          FROM_MS: ${{ inputs.from_ms }}
          TO_MS: ${{ inputs.to_ms }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const from = Number(process.env.FROM_MS);
          const to = Number(process.env.TO_MS);
          if (!Number.isSafeInteger(from) || !Number.isSafeInteger(to) || from <= 0 || to < from || to - from > 3_600_000) {
            throw new Error('invalid_or_unbounded_test_account_window');
          }
          const sql = `SELECT id, profile_id, conversation_id, status, stage, generation, created_at, updated_at
            FROM durable_tasks WHERE conversation_id LIKE 'tg-1714048-s%'
            AND created_at BETWEEN ${from} AND ${to} ORDER BY created_at DESC LIMIT 5`;
          const output = execFileSync('npx', ['--yes', 'wrangler@4.151.0', 'd1', 'execute', 'ta-cp-production-taskstore', '--remote',
            '--config', 'wrangler.production.jsonc', '--json', '--command', sql], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] });
          let result;
          try { result = JSON.parse(output); } catch { throw new Error('test_account_task_query_invalid_json'); }
          const batches = Array.isArray(result) ? result : [result];
          const rows = batches.flatMap(batch => Array.isArray(batch?.results) ? batch.results : []);
          const safe = rows.map(row => ({
            id: typeof row.id === 'string' && /^ut-[A-Za-z0-9_-]{1,80}$/.test(row.id) ? row.id : null,
            profileId: row.profile_id === 'trained-assist-production' ? row.profile_id : null,
            conversationId: typeof row.conversation_id === 'string' && /^tg-1714048-s[a-f0-9]{24}$/.test(row.conversation_id) ? row.conversation_id : null,
            status: typeof row.status === 'string' && /^[a-z_]{1,40}$/.test(row.status) ? row.status : null,
            stage: typeof row.stage === 'string' && /^[a-z_]{1,40}$/.test(row.stage) ? row.stage : null,
            generation: Number.isSafeInteger(row.generation) ? row.generation : null,
            createdAt: Number.isSafeInteger(row.created_at) ? row.created_at : null,
            updatedAt: Number.isSafeInteger(row.updated_at) ? row.updated_at : null,
          }));
          console.log(JSON.stringify({ mode: 'read_only_test_account_task_lookup', fromMs: from, toMs: to, rows: safe }));
          NODE
