name: Deploy isolated CP sandbox-3

on:
  workflow_dispatch:
    inputs:
      deploy_sandbox3:
        description: Deploy the cohort-scoped sandbox-3 E2E Worker from protected main
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: control-plane-sandbox3-deploy
  cancel-in-progress: false

jobs:
  deploy-sandbox3:
    if: github.ref == 'refs/heads/main' && inputs.deploy_sandbox3 == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami 2>&1 | tee /tmp/whoami.txt
          grep -F "d740a05e9442c1d0feacae2dfc673e93" /tmp/whoami.txt
          grep -F "Typeformowner@gmail.com's Account" /tmp/whoami.txt
      - name: Install scoped Communication Worker credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          COMMUNICATION_TOKEN: ${{ secrets.COMMUNICATION_TOKEN }}
        run: |
          test -n "$COMMUNICATION_TOKEN"
          printf '%s' "$COMMUNICATION_TOKEN" | npx wrangler secret put COMMUNICATION_TOKEN --config wrangler.sandbox3.jsonc
      - name: Install sandbox3 passive media credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          INGRESS_BUFFER_TOKEN: ${{ secrets.INGRESS_BUFFER_TOKEN_SANDBOX3 }}
        run: |
          set -euo pipefail
          test -n "$INGRESS_BUFFER_TOKEN"
          printf '%s' "$INGRESS_BUFFER_TOKEN" | npx wrangler secret put INGRESS_BUFFER_TOKEN --config wrangler.sandbox3.jsonc
      - name: Install France VM ingress resolver principal credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RUNNER_INGRESS_SECRET: ${{ secrets.SANDBOX3_RUNNER_INGRESS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_INGRESS_SECRET"
          printf '%s' "$RUNNER_INGRESS_SECRET" | npx wrangler secret put PRINCIPAL_SECRET_SANDBOX3_RUNNER --config wrangler.sandbox3.jsonc
      - name: Deploy isolated sandbox-3 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox3.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Verify read-only liveness and exact source SHA
        run: node tools/deployment-smoke.mjs https://trained-assist-cp-sandbox3.skillset-apply.workers.dev "$GITHUB_SHA"
