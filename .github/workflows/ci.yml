name: CI and protected deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_deploy:
        description: Deploy the current protected main revision after repeating every gate
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Evidence sanitizer self-check
        run: npm run check:evidence
      - name: Safe sandbox bootstrap command diagnostics
        run: node --experimental-strip-types --test tools/command-failure.test.mjs tools/bootstrap-telegram-ux-mock-runner.test.mjs tools/verified-sandbox-script.test.mjs tools/sandbox3-lane-preflight.test.mjs tools/sandbox3-public-route.test.mjs tools/sandbox3-cp-pairing.test.mjs tools/sandbox3-cp-probe-request.test.mjs tools/sandbox3-test-cleanup.test.mjs tools/telegram-ux-state-cleanup.test.mjs tools/telegram-ux-runner-task-cleanup.test.mjs tools/reconcile-telegram-ux-france-worker.test.mjs tools/production-agent-smoke.test.mjs tools/sandbox-agent-smoke.test.mjs tools/agent-api-boundary.test.mjs
      - name: Deployment and credential boundary verifiers
        run: node --test tools/deployment-config-verify.test.mjs tools/credential-boundary-verify.test.mjs

      - name: Live quick-answer smoke safety tests
        run: node --test tools/communication-v1-live-smoke.test.mjs

  deploy-staging:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_deploy))
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami 2>&1 | tee /tmp/whoami.txt
          grep -F "d740a05e9442c1d0feacae2dfc673e93" /tmp/whoami.txt
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ta-cp-staging-taskstore --remote --config wrangler.staging.jsonc
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Smoke staging
        run: node tools/deployment-smoke.mjs https://trained-assist-cp-staging.skillset-apply.workers.dev "$GITHUB_SHA"

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_deploy))
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      # The CP deploy also ships this pinned Runner source; advance it with the reviewed Runner API release.
      RUNNER_PRODUCTION_SOURCE_SHA: 55a18455b7d6161c393c2536b5deb7d089172605
      RUNNER_PRODUCTION_URL: https://trained-assist-runner-api-production.skillset-apply.workers.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami 2>&1 | tee /tmp/whoami.txt
          grep -F "d740a05e9442c1d0feacae2dfc673e93" /tmp/whoami.txt
      - name: Check out the pinned Runner API release source
        uses: actions/checkout@v4
        with:
          repository: trained-assist/ai-agent-runner
          ref: ${{ env.RUNNER_PRODUCTION_SOURCE_SHA }}
          path: runner-production-source
          persist-credentials: false
      - name: Check the isolated production Runner API
        working-directory: runner-production-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run worker:dry-run:production
          npx wrangler whoami 2>&1 | tee /tmp/runner-whoami.txt
          grep -F "$CLOUDFLARE_ACCOUNT_ID" /tmp/runner-whoami.txt
      - name: Provision paired production Runner credentials
        working-directory: runner-production-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
          RUN_LAUNCH_ENCRYPTION_KEY: ${{ secrets.RUN_LAUNCH_ENCRYPTION_KEY }}
          EU_VM_WORKER_URL: ${{ vars.EU_VM_WORKER_URL }}
          EU_VM_WORKER_TOKEN: ${{ secrets.EU_VM_WORKER_TOKEN }}
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
        run: |
          set -euo pipefail
          for name in RUNNER_API_KEY_AGENT_API RUNNER_PROFILE_DELEGATION_SECRET RUN_LAUNCH_ENCRYPTION_KEY EU_VM_WORKER_URL EU_VM_WORKER_TOKEN LLM_LADDER_TOKEN; do
            test -n "${!name}" || { echo "required production Runner credential is missing: $name" >&2; exit 1; }
          done
          node --input-type=module <<'NODE' | npx wrangler secret bulk --config wrangler.production.jsonc >/dev/null
          import { createHash } from 'node:crypto';
          const required = ['RUNNER_API_KEY_AGENT_API', 'RUNNER_PROFILE_DELEGATION_SECRET', 'RUN_LAUNCH_ENCRYPTION_KEY', 'EU_VM_WORKER_URL', 'EU_VM_WORKER_TOKEN', 'LLM_LADDER_TOKEN'];
          for (const name of required) if (!process.env[name]) throw new Error(`missing production Runner credential: ${name}`);
          const keyHash = createHash('sha256').update(process.env.RUNNER_API_KEY_AGENT_API).digest('hex');
          const principal = { keyHash, principalId: 'cp-production-runner', profileId: 'trained-assist-production', tenantId: 'trained-assist-production', repository: 'trained-assist/ai-agent-runner', scopes: ['runs:read', 'runs:write'], engines: ['eu-vm-agent-run'] };
          process.stdout.write(JSON.stringify({
            RUNNER_API_KEYS_PRODUCTION: JSON.stringify([principal]),
            AGENT_API_PROFILE_DELEGATION_SECRET: process.env.RUNNER_PROFILE_DELEGATION_SECRET,
            RUN_LAUNCH_ENCRYPTION_KEY: process.env.RUN_LAUNCH_ENCRYPTION_KEY,
            VM_WORKER_URL: process.env.EU_VM_WORKER_URL,
            VM_WORKER_TOKEN: process.env.EU_VM_WORKER_TOKEN,
            LLM_LADDER_TOKEN: process.env.LLM_LADDER_TOKEN,
          }));
          NODE
          npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:"$RUNNER_PRODUCTION_SOURCE_SHA"
      - name: Verify production Runner health and exact source revision
        env:
          RUNNER_SHA: ${{ env.RUNNER_PRODUCTION_SOURCE_SHA }}
          RUNNER_URL: ${{ env.RUNNER_PRODUCTION_URL }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
        run: |
          set -euo pipefail
          version_http='000'
          for attempt in $(seq 1 30); do
            version_http="$(curl --silent --output "$RUNNER_TEMP/runner-version.json" --write-out '%{http_code}' --max-time 2 "$RUNNER_URL/version" 2>/dev/null || true)"
            if [[ "$version_http" == '200' ]] && node --input-type=module - "$RUNNER_TEMP/runner-version.json" "$RUNNER_SHA" >/dev/null 2>&1 <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (version.buildSha !== process.argv[3]) process.exit(1);
          NODE
            then
              break
            fi
            sleep 0.5
          done
          if [[ "$version_http" != '200' ]]; then
            echo "production Runner version endpoint did not become ready (last HTTP $version_http)" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 "$RUNNER_URL/healthz" > "$RUNNER_TEMP/runner-health.json"
          node --input-type=module - "$RUNNER_TEMP/runner-health.json" "$RUNNER_TEMP/runner-version.json" "$RUNNER_SHA" <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const version = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          if (health.status !== 'ok' || health.placement !== 'cloudflare-worker') {
            throw new Error('production_runner_health_mismatch');
          }
          if (version.buildSha !== process.argv[4]) throw new Error('production_runner_sha_mismatch');
          console.log(JSON.stringify({ runnerHealth: 'ok', runnerBuildSha: version.buildSha }));
          NODE
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          const profileId = 'trained-assist-production';
          const tenantId = 'trained-assist-production';
          const principalId = 'cp-production-runner';
          const expiresAt = String(Date.now() + 60_000);
          const message = `${principalId}\0${tenantId}\0${profileId}\0${expiresAt}`;
          const signature = createHmac('sha256', process.env.RUNNER_PROFILE_DELEGATION_SECRET).update(message).digest('hex');
          const response = await fetch(`${process.env.RUNNER_URL}/v1/capabilities`, {
            headers: {
              authorization: `Bearer ${process.env.RUNNER_API_KEY_AGENT_API}`,
              'x-agent-profile-id': profileId,
              'x-agent-profile-tenant': tenantId,
              'x-agent-profile-exp': expiresAt,
              'x-agent-profile-sig': signature,
            },
          });
          if (!response.ok) throw new Error(`production Runner authenticated capability probe failed: HTTP ${response.status}`);
          const body = await response.json();
          if (body.placement !== 'cloudflare-worker' || !body.executionRegions?.includes('eu-vm-agent-run')) {
            throw new Error('production Runner capability response mismatch');
          }
          console.log('Production Runner API key and delegated profile authenticated successfully.');
          NODE
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ta-cp-production-taskstore --remote --config wrangler.production.jsonc
      - name: Provision the isolated production agent smoke principal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "INSERT INTO admission_principals (principal_id, profile_id, scopes, enabled, created_at, updated_at) VALUES ('production-agent-smoke-v1', 'production-agent-smoke-v1', '[\"tasks:intake\",\"tasks:read\",\"tasks:signal\",\"tasks:control\"]', 1, strftime('%s','now')*1000, strftime('%s','now')*1000) ON CONFLICT(principal_id) DO UPDATE SET profile_id=excluded.profile_id, scopes=excluded.scopes, enabled=1, updated_at=excluded.updated_at"
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "DELETE FROM admission_principals WHERE principal_id='production-e2e-telegram-v1'"
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "SELECT principal_id, profile_id, scopes, enabled FROM admission_principals WHERE principal_id='production-agent-smoke-v1'"
      - name: Provision production gateway principal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "INSERT INTO admission_principals (principal_id, profile_id, scopes, enabled, created_at, updated_at) VALUES ('gateway', 'trained-assist-production', '[\"tasks:intake\",\"tasks:read\",\"tasks:signal\",\"tasks:control\"]', 1, strftime('%s','now')*1000, strftime('%s','now')*1000) ON CONFLICT(principal_id) DO UPDATE SET profile_id=excluded.profile_id, scopes=excluded.scopes, enabled=1, updated_at=excluded.updated_at"
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "SELECT principal_id, profile_id, scopes, enabled FROM admission_principals WHERE principal_id='gateway'"
      - name: Provision read-only production Runner ingress principal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute ta-cp-production-taskstore --remote --config wrangler.production.jsonc --command "INSERT INTO admission_principals (principal_id, profile_id, scopes, enabled, created_at, updated_at) VALUES ('production-runner-ingress-v1', 'trained-assist-production', '[\"tasks:read\"]', 1, strftime('%s','now')*1000, strftime('%s','now')*1000) ON CONFLICT(principal_id) DO UPDATE SET profile_id=excluded.profile_id, scopes=excluded.scopes, enabled=1, updated_at=excluded.updated_at"
      - name: Pair Control Plane with production Runner API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
          COMMUNICATION_PRODUCTION_TOKEN: ${{ secrets.COMMUNICATION_PRODUCTION_TOKEN }}
          PRODUCTION_AGENT_SMOKE_SECRET: ${{ secrets.PRODUCTION_E2E_PRINCIPAL_SECRET }}
          PRODUCTION_RUNNER_INGRESS_SECRET: ${{ secrets.PRODUCTION_RUNNER_INGRESS_SECRET }}
          PRINCIPAL_SECRET: ${{ secrets.PRINCIPAL_SECRET }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_API_KEY_AGENT_API"
          test -n "$RUNNER_PROFILE_DELEGATION_SECRET"
          test -n "$COMMUNICATION_PRODUCTION_TOKEN"
          test -n "$PRODUCTION_AGENT_SMOKE_SECRET"
          test -n "$PRODUCTION_RUNNER_INGRESS_SECRET"
          test -n "$PRINCIPAL_SECRET"
          node --input-type=module <<'NODE' | npx wrangler secret bulk --config wrangler.production.jsonc >/dev/null
          process.stdout.write(JSON.stringify({
            RUNNER_PROFILE_DELEGATION_SECRET: process.env.RUNNER_PROFILE_DELEGATION_SECRET,
            RUNNER_API_KEY_AGENT_API: process.env.RUNNER_API_KEY_AGENT_API,
            COMMUNICATION_TOKEN: process.env.COMMUNICATION_PRODUCTION_TOKEN,
            PRINCIPAL_SECRET_PRODUCTION_AGENT_SMOKE: process.env.PRODUCTION_AGENT_SMOKE_SECRET,
            PRINCIPAL_SECRET_PRODUCTION_RUNNER_INGRESS: process.env.PRODUCTION_RUNNER_INGRESS_SECRET,
            PRINCIPAL_SECRET: process.env.PRINCIPAL_SECRET,
          }));
          NODE
      - name: Verify production Communication resolver credential and tool
        env:
          COMMUNICATION_PRODUCTION_TOKEN: ${{ secrets.COMMUNICATION_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch('https://trained-assist-communication-skills.skillset-apply.workers.dev/mcp', {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.COMMUNICATION_PRODUCTION_TOKEN}`,
              'content-type': 'application/json', accept: 'application/json', 'mcp-protocol-version': '2024-11-05' },
            body: JSON.stringify({ jsonrpc: '2.0', id: 'production-communication-preflight', method: 'tools/list' }),
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`communication_worker_http_${response.status}`);
          const rpc = await response.json();
          const tools = rpc?.result?.tools;
          if (!Array.isArray(tools) || !tools.some(tool => tool.name === 'resolve_user_intent')) {
            throw new Error('communication_resolver_tool_unavailable');
          }
          console.log('Production Communication resolver auth and tool listing verified; no model call made.');
          NODE
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Smoke production
        run: node tools/deployment-smoke.mjs https://trained-assist-cp-production.skillset-apply.workers.dev "$GITHUB_SHA"
