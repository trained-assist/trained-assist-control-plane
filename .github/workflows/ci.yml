name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Проверки санитизации evidence (P16) идут отдельным node-скриптом:
      # файловые операции в workerd-пуле vitest запрещены.
      - name: Connected App approval contract self-check
        run: node tools/connected-app-approval-contract-check.mjs
      - name: Agent Profile Context contract pin
        run: node tools/agent-profile-context-contract-check.mjs
      - name: Evidence sanitizer self-check
        run: npm run check:evidence
      - name: Read-only credential boundary verifier
        run: node --test tools/credential-boundary-verify.test.mjs
