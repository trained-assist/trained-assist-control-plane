name: CI and protected deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_deploy:
        description: Deploy the current protected main revision after repeating every gate
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Evidence sanitizer self-check
        run: npm run check:evidence
      - name: Safe sandbox bootstrap command diagnostics
        run: node --experimental-strip-types --test tools/command-failure.test.mjs tools/bootstrap-telegram-ux-mock-runner.test.mjs tools/verified-sandbox-script.test.mjs tools/sandbox3-lane-preflight.test.mjs tools/sandbox3-public-route.test.mjs tools/sandbox3-cp-pairing.test.mjs tools/sandbox3-cp-probe-request.test.mjs tools/sandbox3-test-cleanup.test.mjs tools/telegram-ux-state-cleanup.test.mjs tools/telegram-ux-runner-task-cleanup.test.mjs tools/reconcile-telegram-ux-france-worker.test.mjs
      - name: Deployment and credential boundary verifiers
        run: node --test tools/deployment-config-verify.test.mjs tools/credential-boundary-verify.test.mjs

      - name: Live quick-answer smoke safety tests
        run: node --test tools/communication-v1-live-smoke.test.mjs

  deploy-staging:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_deploy))
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami 2>&1 | tee /tmp/whoami.txt
          grep -F "d740a05e9442c1d0feacae2dfc673e93" /tmp/whoami.txt
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ta-cp-staging-taskstore --remote --config wrangler.staging.jsonc
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Smoke staging
        run: node tools/deployment-smoke.mjs https://trained-assist-cp-staging.skillset-apply.workers.dev "$GITHUB_SHA"

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_deploy))
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      RUNNER_PRODUCTION_SOURCE_SHA: fae0ba25e2d4784c3899e9b1dd8f7defd444c25c
      RUNNER_PRODUCTION_URL: https://trained-assist-runner-api-production.skillset-apply.workers.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami 2>&1 | tee /tmp/whoami.txt
          grep -F "d740a05e9442c1d0feacae2dfc673e93" /tmp/whoami.txt
      - name: Check out the pinned Runner API release source
        uses: actions/checkout@v4
        with:
          repository: trained-assist/ai-agent-runner
          ref: ${{ env.RUNNER_PRODUCTION_SOURCE_SHA }}
          path: runner-production-source
          persist-credentials: false
      - name: Check the isolated production Runner API
        working-directory: runner-production-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run worker:dry-run:production
          npx wrangler whoami 2>&1 | tee /tmp/runner-whoami.txt
          grep -F "$CLOUDFLARE_ACCOUNT_ID" /tmp/runner-whoami.txt
      - name: Provision paired production Runner credentials
        working-directory: runner-production-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
          RUN_LAUNCH_ENCRYPTION_KEY: ${{ secrets.RUN_LAUNCH_ENCRYPTION_KEY }}
          EU_VM_WORKER_URL: ${{ secrets.EU_VM_WORKER_URL }}
          EU_VM_WORKER_TOKEN: ${{ secrets.EU_VM_WORKER_TOKEN }}
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
        run: |
          set -euo pipefail
          for name in RUNNER_API_KEY_AGENT_API RUNNER_PROFILE_DELEGATION_SECRET RUN_LAUNCH_ENCRYPTION_KEY EU_VM_WORKER_URL EU_VM_WORKER_TOKEN LLM_LADDER_TOKEN; do
            test -n "${!name}" || { echo "required production Runner credential is missing: $name" >&2; exit 1; }
          done
          registry="$(RUNNER_API_KEY_AGENT_API="$RUNNER_API_KEY_AGENT_API" node --input-type=module -e '
            import { createHash } from "node:crypto";
            const key = process.env.RUNNER_API_KEY_AGENT_API;
            const keyHash = createHash("sha256").update(key).digest("hex");
            process.stdout.write(JSON.stringify([{ keyHash, principalId: "cp-production-runner", profileId: "trained-assist-production", tenantId: "trained-assist-production", repository: "trained-assist/ai-agent-runner", scopes: ["runs:read", "runs:write"], engines: ["eu-vm-agent-run"] }]));
          ')"
          printf '%s' "$registry" | npx wrangler secret put RUNNER_API_KEYS --config wrangler.production.jsonc >/dev/null
          unset registry
          printf '%s' "$RUNNER_PROFILE_DELEGATION_SECRET" | npx wrangler secret put AGENT_API_PROFILE_DELEGATION_SECRET --config wrangler.production.jsonc >/dev/null
          printf '%s' "$RUN_LAUNCH_ENCRYPTION_KEY" | npx wrangler secret put RUN_LAUNCH_ENCRYPTION_KEY --config wrangler.production.jsonc >/dev/null
          printf '%s' "$EU_VM_WORKER_URL" | npx wrangler secret put VM_WORKER_URL --config wrangler.production.jsonc >/dev/null
          printf '%s' "$EU_VM_WORKER_TOKEN" | npx wrangler secret put VM_WORKER_TOKEN --config wrangler.production.jsonc >/dev/null
          printf '%s' "$LLM_LADDER_TOKEN" | npx wrangler secret put LLM_LADDER_TOKEN --config wrangler.production.jsonc >/dev/null
          npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:"$RUNNER_PRODUCTION_SOURCE_SHA"
      - name: Verify production Runner health and exact source revision
        env:
          RUNNER_SHA: ${{ env.RUNNER_PRODUCTION_SOURCE_SHA }}
          RUNNER_URL: ${{ env.RUNNER_PRODUCTION_URL }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
        run: |
          set -euo pipefail
          version_http='000'
          for attempt in $(seq 1 30); do
            version_http="$(curl --silent --output "$RUNNER_TEMP/runner-version.json" --write-out '%{http_code}' --max-time 2 "$RUNNER_URL/version" 2>/dev/null || true)"
            if [[ "$version_http" == '200' ]] && node --input-type=module - "$RUNNER_TEMP/runner-version.json" "$RUNNER_SHA" >/dev/null 2>&1 <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (version.buildSha !== process.argv[3]) process.exit(1);
          NODE
            then
              break
            fi
            sleep 0.5
          done
          if [[ "$version_http" != '200' ]]; then
            echo "production Runner version endpoint did not become ready (last HTTP $version_http)" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 "$RUNNER_URL/healthz" > "$RUNNER_TEMP/runner-health.json"
          node --input-type=module - "$RUNNER_TEMP/runner-health.json" "$RUNNER_TEMP/runner-version.json" "$RUNNER_SHA" <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const version = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          if (health.status !== 'ok' || health.placement !== 'cloudflare-worker') {
            throw new Error('production_runner_health_mismatch');
          }
          if (version.buildSha !== process.argv[4]) throw new Error('production_runner_sha_mismatch');
          console.log(JSON.stringify({ runnerHealth: 'ok', runnerBuildSha: version.buildSha }));
          NODE
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          const profileId = 'trained-assist-production';
          const tenantId = 'trained-assist-production';
          const principalId = 'cp-production-runner';
          const expiresAt = String(Date.now() + 60_000);
          const message = `${principalId}\0${tenantId}\0${profileId}\0${expiresAt}`;
          const signature = createHmac('sha256', process.env.RUNNER_PROFILE_DELEGATION_SECRET).update(message).digest('hex');
          const response = await fetch(`${process.env.RUNNER_URL}/v1/capabilities`, {
            headers: {
              authorization: `Bearer ${process.env.RUNNER_API_KEY_AGENT_API}`,
              'x-agent-profile-id': profileId,
              'x-agent-profile-tenant': tenantId,
              'x-agent-profile-exp': expiresAt,
              'x-agent-profile-sig': signature,
            },
          });
          if (!response.ok) throw new Error(`production Runner authenticated capability probe failed: HTTP ${response.status}`);
          const body = await response.json();
          if (body.placement !== 'cloudflare-worker' || !body.executionRegions?.includes('eu-vm-agent-run')) {
            throw new Error('production Runner capability response mismatch');
          }
          console.log('Production Runner API key and delegated profile authenticated successfully.');
          NODE
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ta-cp-production-taskstore --remote --config wrangler.production.jsonc
      - name: Pair Control Plane with production Runner API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_API_KEY_AGENT_API"
          test -n "$RUNNER_PROFILE_DELEGATION_SECRET"
          printf '%s' "$RUNNER_PROFILE_DELEGATION_SECRET" | npx wrangler secret put RUNNER_PROFILE_DELEGATION_SECRET --config wrangler.production.jsonc >/dev/null
          printf '%s' "$RUNNER_API_KEY_AGENT_API" | npx wrangler secret put RUNNER_API_KEY_AGENT_API --config wrangler.production.jsonc >/dev/null
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Smoke production
        run: node tools/deployment-smoke.mjs https://trained-assist-cp-production.skillset-apply.workers.dev "$GITHUB_SHA"
