name: Bootstrap Telegram UX sandbox Runner credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-ux-sandbox-runner-credentials
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision paired mock-test key and verify CP to Runner pong
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CP_TELEGRAM_UX_PRINCIPAL_SECRET: ${{ secrets.CP_TELEGRAM_UX_PRINCIPAL_SECRET }}
          RUNNER_MOCK_KEY_SEED: ${{ secrets.RUNNER_MOCK_KEY_SEED }}
          VM2_SSH_PRIVATE_KEY: ${{ secrets.VM2_SSH_PRIVATE_KEY }}
          VM2_SSH_HOST: ${{ vars.VM2_SSH_HOST }}
          VM2_SSH_USER: ${{ vars.VM2_SSH_USER }}
          VM2_SSH_KNOWN_HOSTS: ${{ vars.VM2_SSH_KNOWN_HOSTS }}
          GITHUB_SHA: ${{ github.sha }}
        run: node --experimental-strip-types tools/bootstrap-telegram-ux-mock-runner.mjs
      - name: Upload sanitized bootstrap evidence
        if: always() && hashFiles('sandbox-bootstrap-evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telegram-ux-sandbox-runner-credentials-${{ github.run_id }}
          path: sandbox-bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 30
